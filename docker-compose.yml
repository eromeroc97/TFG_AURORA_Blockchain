services:
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    env_file:
      - ./services/auth/.env
    depends_on:
      - postgres-db
      - redis-auth
      - mailpit
      - seq
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`) || PathPrefix(`/api/users`) || PathPrefix(`/api/ecosystems`) || PathPrefix(`/api/devices`) || PathPrefix(`/api/notifications`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.routers.auth.priority=100"
      - "traefik.http.services.auth.loadbalancer.server.port=3001"
      - "traefik.http.middlewares.auth-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.auth.middlewares=auth-strip"
      - "traefik.http.routers.auth-internal.service=auth"
      - "traefik.http.routers.auth-internal.priority=200"
      - "traefik.http.routers.auth-health.rule=PathPrefix(`/api/auth/health`)"
      - "traefik.http.routers.auth-health.entrypoints=web"
      - "traefik.http.routers.auth-health.priority=201"
      - "traefik.http.routers.auth-health.service=auth"
      - "traefik.http.middlewares.auth-health-strip.stripprefix.prefixes=/api/auth"
      - "traefik.http.routers.auth-health.middlewares=auth-health-strip"
      - "traefik.docker.network=aurora-secure-net"
    networks:
      - aurora-secure-net
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    command: ["--webroot", "/mail"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=PathPrefix(`/mail`)"
      - "traefik.http.routers.mailpit.entrypoints=web"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
      - "traefik.docker.network=aurora-secure-net"
    networks:
      - aurora-secure-net
    ports:
      - "1025:1025"
      - "8025:8025"
    expose:
      - "1025"
      - "8025"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8025/mail/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  iot-manager:
    build:
      context: ./services/iot-manager
      dockerfile: Dockerfile
    env_file:
      - ./services/iot-manager/.env
    depends_on:
      - mongo-db
      - redis-iot
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.telemetry.rule=PathPrefix(`/api/telemetry`) || PathPrefix(`/api/iot`)"
      - "traefik.http.routers.telemetry.entrypoints=web"
      - "traefik.http.routers.telemetry.priority=101"
      - "traefik.http.services.telemetry.loadbalancer.server.port=3002"
      - "traefik.http.middlewares.telemetry-strip.stripprefix.prefixes=/api/telemetry,/api/iot"
      - "traefik.http.routers.telemetry.middlewares=telemetry-strip"
      - "traefik.http.routers.telemetry-health.rule=PathPrefix(`/api/iot/health`) || PathPrefix(`/api/telemetry/health`)"
      - "traefik.http.routers.telemetry-health.entrypoints=web"
      - "traefik.http.routers.telemetry-health.priority=202"
      - "traefik.http.routers.telemetry-health.service=telemetry"
      - "traefik.http.middlewares.telemetry-health-strip.stripprefix.prefixes=/api/iot,/api/telemetry"
      - "traefik.http.routers.telemetry-health.middlewares=telemetry-health-strip"
      - "traefik.docker.network=aurora-secure-net"
    networks:
      - aurora-secure-net
    expose:
      - "3002"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  blockchain-manager:
    build:
      context: ./services/blockchain-manager
      dockerfile: Dockerfile
    env_file:
      - ./services/blockchain-manager/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blockchain.rule=PathPrefix(`/api/blockchain`)"
      - "traefik.http.routers.blockchain.entrypoints=web"
      - "traefik.http.routers.blockchain.priority=100"
      - "traefik.http.services.blockchain.loadbalancer.server.port=3004"
      - "traefik.http.middlewares.blockchain-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.blockchain.middlewares=blockchain-strip"
      - "traefik.http.routers.blockchain-health.rule=PathPrefix(`/api/blockchain/health`)"
      - "traefik.http.routers.blockchain-health.entrypoints=web"
      - "traefik.http.routers.blockchain-health.priority=204"
      - "traefik.http.routers.blockchain-health.service=blockchain"
      - "traefik.http.middlewares.blockchain-health-strip.stripprefix.prefixes=/api/blockchain"
      - "traefik.http.routers.blockchain-health.middlewares=blockchain-health-strip"
      - "traefik.docker.network=aurora-secure-net"
    networks:
      - aurora-secure-net
    expose:
      - "3004"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3004/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  webapp:
    image: caddy:2.8.4-alpine
    depends_on:
      - api-gateway
    volumes:
      - ./apps/webapp/dist:/usr/share/caddy:ro
      - ./apps/webapp/Caddyfile:/etc/caddy/Caddyfile:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webapp.rule=PathPrefix(`/`) && !PathPrefix(`/api`) && !PathPrefix(`/traefik`)"
      - "traefik.http.routers.webapp.entrypoints=web"
      - "traefik.http.routers.webapp.priority=1"
      - "traefik.http.services.webapp.loadbalancer.server.port=80"
      - "traefik.docker.network=aurora-secure-net"
    networks:
      - aurora-secure-net
    expose:
      - "80"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 1
      EXEC: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PING: 0
      PLUGINS: 0
      POST: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VERSION: 1
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aurora-secure-net

  api-gateway:
    image: traefik:latest
    depends_on:
      - docker-socket-proxy
    environment:
      DOCKER_API_VERSION: "1.44"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-root.rule=Path(`/traefik`)"
      - "traefik.http.routers.traefik-root.entrypoints=web"
      - "traefik.http.routers.traefik-root.priority=100"
      - "traefik.http.routers.traefik-root.middlewares=traefik-root-redirect"
      - "traefik.http.routers.traefik-root.service=noop@internal"
      - "traefik.http.middlewares.traefik-root-redirect.redirectregex.regex=^http://([^/]+)/traefik$"
      - "traefik.http.middlewares.traefik-root-redirect.redirectregex.replacement=http://$${1}/traefik/dashboard/"
      - "traefik.http.middlewares.traefik-root-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.traefik.rule=PathPrefix(`/traefik`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-strip"
      - "traefik.http.middlewares.traefik-strip.stripprefix.prefixes=/traefik"
      - "traefik.http.routers.traefik-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.traefik-api.entrypoints=web"
      - "traefik.http.routers.traefik-api.priority=1"
      - "traefik.http.routers.traefik-api.service=api@internal"
      - "traefik.docker.network=aurora-secure-net"
    networks:
      - aurora-secure-net

  firefly-proxy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    # Inyectamos el fallback directamente en la línea de comandos
    command: caddy reverse-proxy --from :80 --to ${FIREFLY_HOST:-https://number-try-physical-spotlight.trycloudflare.com} --change-host-header
    labels:
      - "traefik.enable=true"
      # 1. Atrapamos la ruta que llama el frontend
      - "traefik.http.routers.firefly-health.rule=Path(`/api/firefly/health`)"
      - "traefik.http.routers.firefly-health.entrypoints=web"
      - "traefik.http.routers.firefly-health.priority=150"
      
      # 2. Reescribimos la ruta de forma estricta (sin Regex)
      - "traefik.http.middlewares.firefly-rewrite.replacepath.path=/api/v1/status"
      - "traefik.http.routers.firefly-health.middlewares=firefly-rewrite"
      
      # 3. Mandamos el tráfico al puerto interno de Caddy
      - "traefik.http.services.firefly-health.loadbalancer.server.port=80"
      - "traefik.docker.network=aurora-secure-net"
    networks:
      - aurora-secure-net

  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret_password_tfg
      POSTGRES_DB: identity_vault
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - aurora-secure-net

  mongo-db:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret_password_tfg
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - aurora-secure-net

  redis-auth:
    image: redis:7-alpine
    container_name: redis-auth
    command: ["redis-server"]
    ports:
      - "6379:6379"
    volumes:
      - redis_auth_data:/data
    networks:
      - aurora-secure-net

  redis-iot:
    image: redis:7-alpine
    container_name: redis-iot
    command: ["redis-server"]
    ports:
      - "6380:6379"
    volumes:
      - redis_iot_data:/data
    networks:
      - aurora-secure-net

  seq:
    image: datalust/seq:latest
    env_file:
      - ./services/auth/.env
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq_data:/data
    networks:
      - aurora-secure-net

  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    # Exponemos el puerto SOLO a localhost por seguridad
    ports:
      - "127.0.0.1:8090:8081"
    environment:
      # Cadena de conexión interna usando el nombre del servicio (mongo-db) y credenciales root
      ME_CONFIG_MONGODB_URL: mongodb://admin:secret_password_tfg@mongo-db:27017/
      
      # Credenciales de Basic Auth para entrar a la propia interfaz web (pon las que quieras)
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: aurora_admin
    networks:
      - aurora-secure-net
    depends_on:
      - mongo-db

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    # Exponemos el puerto SOLO a localhost por seguridad
    ports:
      - "127.0.0.1:8091:8081"
    environment:
      REDIS_HOSTS: auth:redis-auth:6379,iot:redis-iot:6380
    networks:
      - aurora-secure-net
    depends_on:
      - redis-auth
      - redis-iot

networks:
  aurora-secure-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_auth_data:
  redis_iot_data:
  seq_data: