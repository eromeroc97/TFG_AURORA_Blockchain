services:
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    env_file:
      - ./services/auth/.env
    depends_on:
      - postgres-db
      - mailpit
      - seq
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`) || PathPrefix(`/api/users`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=3001"
      - "traefik.http.middlewares.auth-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.auth.middlewares=auth-strip"
      - "traefik.docker.network=aurora-secure-net"
    networks:
      - aurora-secure-net
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    command: ["--webroot", "/mail"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=PathPrefix(`/mail`)"
      - "traefik.http.routers.mailpit.entrypoints=web"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
      - "traefik.docker.network=aurora-secure-net"
    networks:
      - aurora-secure-net
    ports:
      - "1025:1025"
      - "8025:8025"
    expose:
      - "1025"
      - "8025"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8025/mail/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  iot-manager:
    build:
      context: ./services/iot-manager
      dockerfile: Dockerfile
    depends_on:
      - mongo-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.telemetry.rule=PathPrefix(`/api/telemetry`)"
      - "traefik.http.routers.telemetry.entrypoints=web"
      - "traefik.http.services.telemetry.loadbalancer.server.port=3002"
      - "traefik.http.middlewares.telemetry-strip.stripprefix.prefixes=/api/telemetry"
      - "traefik.http.routers.telemetry.middlewares=telemetry-strip"
      - "traefik.docker.network=aurora-secure-net"
    networks:
      - aurora-secure-net
    expose:
      - "3002"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  webapp:
    image: caddy:2.8.4-alpine
    depends_on:
      - api-gateway
    volumes:
      - ./apps/webapp/dist:/usr/share/caddy:ro
      - ./apps/webapp/Caddyfile:/etc/caddy/Caddyfile:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webapp.rule=PathPrefix(`/`) && !PathPrefix(`/api`) && !PathPrefix(`/traefik`)"
      - "traefik.http.routers.webapp.entrypoints=web"
      - "traefik.http.routers.webapp.priority=1"
      - "traefik.http.services.webapp.loadbalancer.server.port=80"
      - "traefik.docker.network=aurora-secure-net"
    networks:
      - aurora-secure-net
    expose:
      - "80"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 1
      EXEC: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PING: 0
      PLUGINS: 0
      POST: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VERSION: 1
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aurora-secure-net

  api-gateway:
    image: traefik:latest
    depends_on:
      - docker-socket-proxy
    environment:
      DOCKER_API_VERSION: "1.44"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-root.rule=Path(`/traefik`)"
      - "traefik.http.routers.traefik-root.entrypoints=web"
      - "traefik.http.routers.traefik-root.priority=100"
      - "traefik.http.routers.traefik-root.middlewares=traefik-root-redirect"
      - "traefik.http.routers.traefik-root.service=noop@internal"
      - "traefik.http.middlewares.traefik-root-redirect.redirectregex.regex=^http://([^/]+)/traefik$"
      - "traefik.http.middlewares.traefik-root-redirect.redirectregex.replacement=http://$${1}/traefik/dashboard/"
      - "traefik.http.middlewares.traefik-root-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.traefik.rule=PathPrefix(`/traefik`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-strip"
      - "traefik.http.middlewares.traefik-strip.stripprefix.prefixes=/traefik"
      - "traefik.http.routers.traefik-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.traefik-api.entrypoints=web"
      - "traefik.http.routers.traefik-api.priority=1"
      - "traefik.http.routers.traefik-api.service=api@internal"
      - "traefik.docker.network=aurora-secure-net"
    networks:
      - aurora-secure-net

  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret_password_tfg
      POSTGRES_DB: identity_vault
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - aurora-secure-net

  mongo-db:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret_password_tfg
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - aurora-secure-net

  redis:
    image: redis:alpine
    container_name: redis-cache
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    networks:
      - aurora-secure-net

  seq:
    image: datalust/seq:latest
    env_file:
      - ./services/auth/.env
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq_data:/data
    networks:
      - aurora-secure-net

networks:
  aurora-secure-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  seq_data:
