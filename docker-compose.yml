services:
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=3001"
      - "traefik.http.middlewares.auth-strip.stripprefix.prefixes=/api/auth"
      - "traefik.http.routers.auth.middlewares=auth-strip"
    networks:
      - aurora-secure-net
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  iot-manager:
    build:
      context: ./services/iot-manager
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.telemetry.rule=PathPrefix(`/api/telemetry`)"
      - "traefik.http.routers.telemetry.entrypoints=web"
      - "traefik.http.services.telemetry.loadbalancer.server.port=3002"
      - "traefik.http.middlewares.telemetry-strip.stripprefix.prefixes=/api/telemetry"
      - "traefik.http.routers.telemetry.middlewares=telemetry-strip"
    networks:
      - aurora-secure-net
    expose:
      - "3002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-gateway:
    image: traefik:v3.0
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aurora-secure-net

networks:
  aurora-secure-net:
    driver: bridge
