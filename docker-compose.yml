services:
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    networks:
      - aurora-secure-net
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  iot-manager:
    build:
      context: ./services/iot-manager
      dockerfile: Dockerfile
    networks:
      - aurora-secure-net
    expose:
      - "3002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  aurora-secure-net:
    driver: bridge
