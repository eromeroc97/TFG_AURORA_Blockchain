# Redis base configuration for local development in AURORA.
# For production, enable AUTH/ACL and restrict host-level port exposure.

bind 0.0.0.0
port 6379
protected-mode no

timeout 0
tcp-keepalive 300

# Persistence helps resilience for distributed throttling/session data during restarts.
appendonly yes
appendfsync everysec

# RDB snapshot policy
save 900 1
save 300 10
save 60 10000

# Data directory (mounted volume)
dir /data
