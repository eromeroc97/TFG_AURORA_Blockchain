api:
  dashboard: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  internal:
    address: ":8082"

providers:
  docker:
    endpoint: "tcp://docker-socket-proxy:2375"
    exposedByDefault: false
    network: aurora-secure-net

accessLog:
  filePath: "/var/log/traefik/access.log"
  bufferingSize: 100